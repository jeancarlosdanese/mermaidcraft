[workspace]
resolver = "3"
members = [".", "crates/engine", "crates/cli"]
default-members = [".", "crates/engine", "crates/cli"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mermaidcraft-engine = { path = "crates/engine" }
serde_json = "1"
ttf-parser = "0.25"
resvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = { version = "0.13", default-features = false, features = ["image", "text"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unreachable = "deny"
# Style lints that would only force noisier code here.
collapsible_if = "allow"
too_many_arguments = "allow"
needless_late_init = "allow"
explicit_counter_loop = "allow"
manual_isolate_lowest_one = "allow"
chunks_exact_to_as_chunks = "allow"
type_complexity = "allow"

[package]
name = "mermaidcraft"
description = "MermaidCraft: native Mermaid diagram editor (egui shell over the MermaidCraft engine)"
# Written here (not inherited) so tools that read the version straight from this file, such as the
# shell prompt, show it plainly. Keep it equal to [workspace.package] (checked by a test).
version = "0.8.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "mermaidcraft"

[[bin]]
name = "mermaidcraft"
path = "src/main.rs"

[dependencies]
mermaidcraft-engine.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"
winit = { version = "0.30", default-features = false }

# Linux: a window needs Wayland or X11. The Wayland library is loaded at run time (no build-time
# dependency), and GNOME gets a title bar drawn by the app (it has no server-side decorations).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
